# One service. The agent runtime (codex + esbuild) installs itself into a cache
# on first run, so there is no sidecar to bridge to — the two-container layout
# this file used to describe went with the ACP wire.
#
# The published port is the **off-box** acceptor (`HI_AGENT_OFF_BOX`, set in the
# image), so every request through it is gated: watch the log on first run for
#
#     first-boot surface credential — pair with it once, then revoke it in Settings
#
# and hand that to the first app. Loopback inside the container stays ungated,
# which is what the codex subprocesses and the view renderer use.

services:
  hi-agent:
    build: .
    environment:
      RUST_LOG: info
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    command:
      - --data-dir=/data
