<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Declare an icon, and a `data:` one, because of what this page is: a view
         mounted for somebody to look at, and the page a share is published *as*.
         A document with no icon link makes Chrome fall back to the root
         `/favicon.ico` — a request the page makes, never the view — and a share's
         scope serves only the view's own files, so that fallback refused every
         view in the install. A real path here (the SPA's own icon set) would be
         that same out-of-scope request; `data:,` is a valid icon that resolves to
         nothing, so the browser asks for nothing and shows nothing. -->
    <link rel="icon" href="data:," />
    <title>hi-agent view render</title>
    <style>
      /* Paint the paper immediately: a render that captures before the CSS chunk
         lands must still not screenshot a default-white page and call it a view. */
      html, body { background: #ffffff; margin: 0; height: 100%; }
    </style>
    <script>
      // A review is a picture, not a speaker. The same HTML also serves shared
      // pages, so silence only the private /render/view preview.
      if (location.pathname === "/render/view") {
        const muted = Object.getOwnPropertyDescriptor(HTMLMediaElement.prototype, "muted");
        Object.defineProperty(HTMLMediaElement.prototype, "muted", {
          configurable: true,
          get() { return true; },
          set(_) { muted.set.call(this, true); },
        });
        const play = HTMLMediaElement.prototype.play;
        HTMLMediaElement.prototype.play = function () {
          this.muted = true;
          return play.call(this);
        };
        const silenceMedia = (root) => {
          if (root instanceof HTMLMediaElement) root.muted = true;
          root.querySelectorAll?.("audio, video").forEach((media) => { media.muted = true; });
        };
        new MutationObserver((records) => {
          for (const record of records) {
            for (const node of record.addedNodes) {
              if (node instanceof Element) silenceMedia(node);
            }
          }
        }).observe(document, { childList: true, subtree: true });

        // Muting media elements does not cover a view using Web Audio directly.
        // Route connections to each context's output through a zero-gain node.
        const connect = AudioNode.prototype.connect;
        const sinks = new WeakMap();
        AudioNode.prototype.connect = function (target, ...args) {
          if (target instanceof AudioDestinationNode) {
            let sink = sinks.get(this.context);
            if (!sink) {
              sink = this.context.createGain();
              sink.gain.value = 0;
              connect.call(sink, target);
              sinks.set(this.context, sink);
            }
            connect.call(this, sink, ...args);
            return target;
          }
          return connect.call(this, target, ...args);
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/render/main.tsx"></script>
  </body>
</html>
